# Diagnóstico temporário do envio de e-mail (SMTP do Brevo), sem mostrar segredos.
# Usa os mesmos segredos do worker (SMTP_URL e MAIL_FROM têm os mesmos valores do Render).
# Confere o login no SMTP e manda um e-mail de teste para o próprio remetente.
name: Diagnóstico de e-mail

on:
  push:
    branches: [ccr-5f6ddb3a-27f3t4]
    paths: [.github/workflows/diagnostico-email.yml]
  workflow_dispatch:

jobs:
  smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@presenca/emails"
      - name: Testa o SMTP
        working-directory: packages/emails
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TRANSPORT: ${{ secrets.MAIL_TRANSPORT }}
        run: |
          node --input-type=module -e '
          import { createTransport } from "nodemailer";
          const hide = (s) => String(s ?? "").replace(/[^\s<>"]+@[^\s<>"]+/g, "<e-mail>");
          const say = (k, v) => console.log(k.padEnd(22), v);
          const url = process.env.SMTP_URL ?? "";
          const from = process.env.MAIL_FROM ?? "";
          say("MAIL_TRANSPORT", process.env.MAIL_TRANSPORT || "(vazio)");
          say("SMTP_URL definida", url ? "sim" : "NÃO");
          say("MAIL_FROM definida", from ? "sim" : "NÃO");
          let u;
          try { u = new URL(url); } catch { say("SMTP_URL válida", "NÃO (não é uma URL)"); process.exit(1); }
          say("protocolo", u.protocol);
          say("servidor", u.hostname + ":" + (u.port || "(padrão)"));
          say("tem usuário e senha", u.username && u.password ? "sim" : "NÃO");
          const addr = (from.match(/<([^>]+)>/)?.[1] ?? from).trim();
          say("domínio do remetente", addr.split("@")[1] ?? "(sem @)");
          const t = createTransport(url);
          try {
            await t.verify();
            say("login no SMTP", "OK");
          } catch (e) {
            say("login no SMTP", "FALHOU");
            say("erro", hide(e.code) + " " + hide(e.responseCode) + " " + hide(e.response ?? e.message));
            process.exit(1);
          }
          try {
            const info = await t.sendMail({
              from, to: addr,
              subject: "Teste de envio · Monitor de Presenças",
              text: "Se este e-mail chegou, o SMTP está funcionando. Pode apagar.",
            });
            say("envio de teste", "ACEITO pelo servidor");
            say("resposta", hide(info.response));
            say("recusados", info.rejected?.length ?? 0);
          } catch (e) {
            say("envio de teste", "FALHOU");
            say("erro", hide(e.code) + " " + hide(e.responseCode) + " " + hide(e.response ?? e.message));
            process.exit(1);
          }
          '
