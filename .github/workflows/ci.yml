name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade (formato, lint, arquitetura, tipos, testes, banco, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilidades em dependências de produção
        run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      # O lint usa tipos: os pacotes internos (dist/*.d.ts) precisam estar compilados antes.
      - name: Compilar pacotes internos
        run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm lint
      - name: Barreira de arquitetura (web nunca importa o banco)
        run: pnpm lint:deps
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations em dia com o schema (nenhuma mudança sem migration)
        run: pnpm db:check
        env:
          # O drizzle-kit exige a URL, mas a checagem não conecta no banco.
          DATABASE_URL_OWNER: postgres://ci:ci@127.0.0.1:5432/ci
      - name: Testes de integração (Postgres real via Testcontainers)
        run: pnpm test:int
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E no navegador (builds de produção)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Postgres, Valkey e Mailpit
        run: pnpm infra:up
      - run: pnpm db:migrate
      - run: pnpm build

      - name: Sobe API, worker e web
        run: |
          # NODE_ENV=test: sem consulta externa de senhas vazadas; resto igual ao .env de desenvolvimento.
          NODE_ENV=test nohup node apps/api/dist/main.js > api.log 2>&1 &
          # O worker entrega os alertas por e-mail (Mailpit) que o E2E de avisos confere.
          NODE_ENV=test nohup node apps/worker/dist/main.js > worker.log 2>&1 &
          nohup pnpm --filter @presenca/web start > web.log 2>&1 &
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors http://localhost:4000/readyz
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:3000/entrar

      - run: pnpm --filter @presenca/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Relatório e logs (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-relatorio
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            worker.log
            web.log
          retention-days: 7

  docker:
    name: Imagem ${{ matrix.service }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v5

      - name: Valida o docker-compose de desenvolvimento
        if: matrix.service == 'api'
        run: docker compose -f infra/docker-compose.yml config --quiet

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: false
          load: ${{ matrix.service == 'api' }}
          tags: presenca-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Ensaio de deploy (banco novo → migrations pela imagem → /readyz 200)
        if: matrix.service == 'api'
        run: bash infra/ci/smoke-api.sh presenca-api:ci
