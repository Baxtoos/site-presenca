packages:
  - apps/*
  - packages/*
  - e2e

# Pacotes autorizados a rodar scripts de instalação (o pnpm 10 bloqueia por padrão).
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp

# Scripts de instalação dispensáveis (acelerações nativas opcionais do cliente Docker dos testes).
ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2

# Versões centralizadas: cada package.json usa "catalog:".
catalog:
  # ferramentas
  typescript: ^5.9.2
  turbo: ^2.5.6
  eslint: ^9.35.0
  "@eslint/js": ^9.35.0
  typescript-eslint: ^8.43.0
  globals: ^16.3.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^5.2.0
  "@next/eslint-plugin-next": ^16.0.1
  prettier: ^3.6.2
  dependency-cruiser: ^16.10.0
  vitest: ^4.1.12
  fast-check: ^4.10.2
  fake-indexeddb: ^6.2.2
  tsx: ^4.20.5
  "@types/node": ^22.18.0
  # web
  next: ^16.0.1
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.2
  "@types/react-dom": ^19.2.2
  tailwindcss: ^4.1.13
  "@tailwindcss/postcss": ^4.1.13
  server-only: ^0.0.1
  qrcode: 1.5.4
  "@types/qrcode": 1.5.6
  "@playwright/test": ~1.64.1
  "@axe-core/playwright": 4.14.0
  # api
  "@nestjs/common": ^11.1.6
  "@nestjs/core": ^11.1.6
  "@nestjs/platform-fastify": ^11.1.6
  "@nestjs/testing": ^11.1.6
  "@nestjs/cli": ^11.0.10
  fastify: ^5.6.0
  "@fastify/helmet": ^13.2.0
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  "@fastify/cookie": ^11.1.5
  "@node-rs/argon2": ^2.2.2
  ioredis: ^5.11.1
  arctic: ^3.7.0
  nodemailer: ~10.3.1
  "@types/nodemailer": ^8.0.2
  exceljs: ^4.4.0
  # observabilidade (opcional: sem SENTRY_DSN nada é enviado)
