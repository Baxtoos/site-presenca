packages:
  - apps/*
  - packages/*

# Pacotes autorizados a rodar scripts de instalação (o pnpm 10 bloqueia por padrão).
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp

# Versões centralizadas: cada package.json usa "catalog:".
catalog:
  # ferramentas
  typescript: ^5.9.2
  turbo: ^2.5.6
  eslint: ^9.35.0
  "@eslint/js": ^9.35.0
  typescript-eslint: ^8.43.0
  globals: ^16.3.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^5.2.0
  "@next/eslint-plugin-next": ^16.0.1
  prettier: ^3.6.2
  dependency-cruiser: ^16.10.0
  vitest: ^3.2.4
  tsx: ^4.20.5
  "@types/node": ^22.18.0
  # web
  next: ^16.0.1
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.2
  "@types/react-dom": ^19.2.2
  tailwindcss: ^4.1.13
  "@tailwindcss/postcss": ^4.1.13
  # api
  "@nestjs/common": ^11.1.6
  "@nestjs/core": ^11.1.6
  "@nestjs/platform-fastify": ^11.1.6
  "@nestjs/testing": ^11.1.6
  "@nestjs/cli": ^11.0.10
  fastify: ^5.6.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  unplugin-swc: ^1.5.7
  "@swc/core": ^1.13.5
  # dados e contratos
