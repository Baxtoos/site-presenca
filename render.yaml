# Blueprint do Render para a API, no plano gratuito (sem cartão).
# O Render lê este arquivo em: Dashboard → New → Blueprint → escolha o repositório.
# As variáveis marcadas `sync: false` ficam VAZIAS aqui de propósito: você preenche no painel do
# Render (nunca coloque segredos neste arquivo). O passo a passo está em docs/deploy-gratuito.md.
services:
  - type: web
    name: presenca-api
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    plan: free
    # Mesma região do banco no Neon (aws-us-east-1, N. Virginia) para as consultas ficarem rápidas.
    region: virginia
    # Liveness, sem tocar no banco: o Neon dorme quando ocioso e não deve derrubar o serviço.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # O Render espera a porta 10000 em serviços web.
      - key: API_PORT
        value: "10000"
      # Dois saltos de proxy: Vercel (reescrita de /api) e o balanceador do Render.
      - key: TRUST_PROXY
        value: "2"
      - key: RATE_LIMIT_FACTOR
        value: "1"
      # Endereço do site na Vercel, com https:// e sem barra no fim.
      - key: WEB_ORIGIN
        sync: false
      # Conexão do papel app_api (saída de `pnpm db:provision`), host DIRETO do Neon (não o -pooler).
      - key: DATABASE_URL
        sync: false
      # URL do Redis do Upstash (rediss://...).
      - key: REDIS_URL
        sync: false
      # E-mail: relay = a API entrega por HTTPS ao site (rota /interno/email), que envia por SMTP.
      # O plano gratuito do Render bloqueia as portas de SMTP; SMTP_URL e MAIL_FROM ficam na Vercel.
      # Com domínio próprio, resend (HTTPS) também funciona daqui. Veja docs/deploy-gratuito.md.
      - key: MAIL_TRANSPORT
        value: relay
      # Segredo compartilhado com a Vercel (o MESMO valor lá): com ele a API recebe o IP real do
      # aluno pelo site. Sem ele, todos aparecem com um IP da Cloudflare e dividem o rate limit.
      - key: API_PROXY_SECRET
        sync: false
      # Segredo só do repasse de e-mail (o MESMO valor na Vercel), diferente do API_PROXY_SECRET.
      # Vazio = usa o API_PROXY_SECRET (configuração antiga).
      - key: MAIL_RELAY_SECRET
        sync: false
      # Chave que cifra os segredos da verificação em duas etapas (openssl rand -base64 32).
      # Vazia = a verificação em duas etapas fica indisponível. Trocar invalida os apps já ligados.
      - key: MFA_ENCRYPTION_KEY
        sync: false
      # Chave que cifra o link .ics e a chave do Moodle (openssl rand -base64 32). A MESMA no
      # worker (segredo do GitHub). Vazia = integração com o Moodle desligada.
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      # Chave da API do Google Gemini para o assistente de notas (aistudio.google.com). Vazia = só
      # o editor manual. O uso sai da conta do Google dona da chave.
      - key: GEMINI_API_KEY
        sync: false
      # E-mail que recebe as sugestões e os problemas da página Conta. Vazio = desligado.
      - key: FEEDBACK_TO
        sync: false
      # A versão (/healthz e Sentry) vem do commit do deploy: o Render preenche RENDER_GIT_COMMIT.
      # Defina APP_VERSION só se quiser outro texto.
      # Rastreamento de erros (Sentry). Vazio = desligado. Veja docs/deploy-gratuito.md.
      - key: SENTRY_DSN
        sync: false
      # Chave PÚBLICA do push (a privada fica só no worker). Vazio = sem push.
      - key: VAPID_PUBLIC_KEY
        sync: false
